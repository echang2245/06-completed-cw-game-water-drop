
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Drop Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="game-wrapper">

        <header class="brand-header">
            <img
                src="img/cw_logo-horizontal.png"
                alt="charity: water"
                class="charity-logo"
            >
        </header>

        <div class="game-heading">
            <div>
                <h1 class="game-title">Water Drop</h1>
                <p class="game-tagline">
                    Catch the good drops, avoid the bad ones!
                </p>
            </div>
            <img
                src="img/water-can-transparent.png"
                alt=""
                class="water-can-illustration"
            >
        </div>

        <!-- Score, timer, and start button -->
        <div class="score-panel">
            <div class="score">
                Score: <span id="score">0</span>
            </div>

            <div class="timer">
                Time: <span id="time">30</span>s
            </div>

            <button id="start-btn">Start Game</button>
        </div>

        <!-- Game area -->
        <div id="game-container">
            <div id="game-message" role="status" aria-live="polite"></div>
        </div>

        <!-- Instructions -->
        <p class="instructions">
            Blue drops = +1 point | Red drops = -1 point
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
